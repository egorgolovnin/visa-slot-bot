<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шенгенские визы с Кипра — открытая статистика одобрений</title>
<meta name="description" content="Реальные кейсы заявителей с Кипра: какие страны одобряют шенгенские визы, сколько ждать решения, какую визу дают.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5; --surface: #fff; --text: #18202b; --muted: #687384; --line: #dde2ea;
    --ink: #6a4bc4; --ink-soft: rgba(106, 75, 196, .10); --ok: #1f8a5b; --bad: #c2410c; --wait: #b7791f;
    font-family: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161d; --surface: #1b212b; --text: #e8ecf2; --muted: #93a0b3; --line: #2a3240;
      --ink: #a58cf0; --ink-soft: rgba(165, 140, 240, .14); --ok: #4cc38a; --bad: #f08a5d; --wait: #e2a84a; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { padding: calc(env(safe-area-inset-top, 0px) + 28px) 18px calc(env(safe-area-inset-bottom, 0px) + 48px);
    font-size: 16px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  main { max-width: 860px; margin: 0 auto; display: grid; gap: 36px; }
  h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.1; font-weight: 800; letter-spacing: -.025em; margin: 0 0 10px; max-width: 18ch; }
  h2 { font-size: 19px; font-weight: 700; margin: 0 0 12px; }
  p { margin: 0; max-width: 62ch; }
  .muted { color: var(--muted); }
  a { color: var(--ink); }

  .hero { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
  .stamp { color: var(--ink); border: 3px solid currentColor; border-radius: 14px; padding: 6px; transform: rotate(-3deg); width: max-content; }
  .stamp-inner { border: 1.5px dashed currentColor; border-radius: 9px; padding: 12px 20px 14px; text-align: center; }
  .stamp b { display: block; font-size: 52px; line-height: 1; font-weight: 800; letter-spacing: -.03em; }
  .stamp small { display: block; font-size: 12.5px; font-weight: 600; margin-top: 6px; }
  .facts { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 14px; }
  .facts b { font-size: 22px; font-weight: 700; display: block; }
  .facts span { font-size: 13px; color: var(--muted); }
  @media (max-width: 600px) { .hero { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border-radius: 18px; padding: 8px 18px; }
  .row { display: grid; grid-template-columns: 9.5rem 1fr auto; gap: 12px; align-items: center; padding: 13px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .name { font-weight: 600; }
  .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .bar .a { background: var(--ok); } .bar .r { background: var(--bad); } .bar .p { background: var(--wait); opacity: .6; }
  .row .meta { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
  .row .meta b { color: var(--text); font-size: 15px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr auto; } .row .bar { grid-column: 1 / -1; order: 3; } }

  .cases { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .case { background: var(--surface); border-radius: 14px; padding: 14px 16px; border-left: 4px solid var(--line); }
  .case.approved { border-left-color: var(--ok); } .case.refused { border-left-color: var(--bad); } .case.pending { border-left-color: var(--wait); }
  .case h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .case .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .case blockquote { margin: 10px 0 0; font-size: 14.5px; }

  .cta { background: var(--ink); color: #fff; border-radius: 18px; padding: 22px; display: grid; gap: 12px; }
  .cta p { color: rgba(255,255,255,.88); }
  .cta .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  .cta a { background: #fff; color: #2d1f63; text-decoration: none; font-weight: 700; padding: 11px 18px; border-radius: 999px; }
  .cta a.ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.6); }
  .cta a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .empty { background: var(--surface); border-radius: 18px; padding: 22px; }
  footer { font-size: 13px; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .stamp { animation: stamp .45s cubic-bezier(.2, 1.4, .4, 1) both; }
    @keyframes stamp { from { transform: rotate(-3deg) scale(1.25); opacity: 0; } to { transform: rotate(-3deg) scale(1); opacity: 1; } }
  }
</style>
</head>
<body>
<main id="app">
  <header>
    <h1>Шенгенские визы с Кипра: открытая статистика</h1>
    <p class="muted">Реальные кейсы заявителей с ВНЖ Кипра. Какие страны одобряют, сколько ждать решения, какую визу дают. Без имён и контактов.</p>
  </header>
  <p class="muted" id="loading">Загружаю статистику…</p>
</main>
<script>
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many; };
const M_NOM = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const M_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const ym2 = (ym, names) => { const [y, m] = ym.split("-"); return `${names[+m - 1]} ${y}`; };
const month = ym => ym ? ym2(ym, M_NOM) : "дата не указана";
const monthGen = ym => ym2(ym, M_GEN);
const OUT = { approved: "Одобрили", refused: "Отказ", pending: "Ждёт решения" };

fetch("/api/cases").then(r => r.json()).then(render).catch(() => {
  document.getElementById("loading").textContent = "Не удалось загрузить статистику. Обнови страницу через минуту.";
});

function render(d) {
  document.getElementById("loading").remove();
  const bot = `https://t.me/${d.bot}`;
  const cta = `<section class="cta">
      <h2 style="margin:0;color:#fff">Нужен слот на подачу?</h2>
      <p>Ловим свободные даты в визовых центрах Никосии и записываем тебя. Оплата сервиса — только после брони.</p>
      <div class="buttons"><a href="${bot}?start=cases">Записаться через бота</a><a class="ghost" href="${bot}?start=case">Поделиться своим кейсом</a></div>
    </section>`;
  if (!d.total) {
    app.insertAdjacentHTML("beforeend", `<div class="empty"><h2>Собираем первые кейсы</h2>
      <p class="muted">Статистика появится, как только заявители поделятся результатами. Подавал на шенген с Кипра? Расскажи, как прошло — это займёт минуту и поможет другим.</p></div>${cta}`);
    return;
  }
  app.insertAdjacentHTML("beforeend", `
    <section class="hero" aria-label="Итог">
      ${d.rate != null ? `<div class="stamp"><div class="stamp-inner"><b>${d.rate}%</b><small>одобрений</small></div></div>` : ""}
      <div>
        <p>${d.decided} ${plural(d.decided, "решение", "решения", "решений")} по ${d.countries_count} ${plural(d.countries_count, "стране", "странам", "странам")}${d.since ? `, подачи с ${monthGen(d.since)}` : ""}.</p>
        <div class="facts">
          ${d.median_days != null ? `<div><b>${d.median_days} ${plural(d.median_days, "день", "дня", "дней")}</b><span>обычно ждут решения</span></div>` : ""}
          <div><b>${d.total}</b><span>${plural(d.total, "кейс", "кейса", "кейсов")} всего</span></div>
        </div>
        ${d.sources && d.sources.visarea ? `<p class="muted" style="margin-top:12px;font-size:13.5px">Из них ${d.sources.visarea} — из открытой базы
          <a href="https://cases.visarea.travel" rel="noopener" target="_blank">cases.visarea.travel</a>, ${d.sources.bot} — от наших клиентов.</p>` : ""}
      </div>
    </section>

    <section aria-label="По странам">
      <h2>По странам</h2>
      <div class="panel">${d.countries.map(c => {
        const t = c.total || 1;
        return `<div class="row">
          <span class="name">${esc(c.country)}</span>
          <span class="bar" role="img" aria-label="${c.approved} одобрено, ${c.refused} отказов, ${c.pending} ждут">
            <i class="a" style="width:${100 * c.approved / t}%"></i><i class="r" style="width:${100 * c.refused / t}%"></i><i class="p" style="width:${100 * c.pending / t}%"></i></span>
          <span class="meta">${c.rate != null ? `<b>${c.rate}%</b> одобрений` : "решений пока нет"}${c.median_days != null ? `, ~${c.median_days} дн` : ""}<br>${c.total} ${plural(c.total, "кейс", "кейса", "кейсов")}</span>
        </div>`; }).join("")}</div>
    </section>

    <section aria-label="Кейсы">
      <h2>Последние кейсы</h2>
      <div class="cases">${d.cases.map(c => `<article class="case ${c.outcome}">
        <h3>${esc(c.country)}: ${OUT[c.outcome]}</h3>
        <div class="sub">Подача: ${month(c.month)}${c.days != null ? `. Решение через ${c.days} ${plural(c.days, "день", "дня", "дней")}` : ""}${c.visa_kind ? `. Виза ${c.visa_kind === "multi" ? "многократная" : "однократная"}` : ""}${c.validity ? `. Срок: ${esc(c.validity.charAt(0).toLowerCase() + c.validity.slice(1))}` : ""}.</div>
        ${c.comment ? `<blockquote>${esc(c.comment)}</blockquote>` : ""}
        ${c.source === "visarea" ? `<div class="sub" style="margin-top:8px">Источник: <a href="https://cases.visarea.travel" rel="noopener" target="_blank">cases.visarea.travel</a></div>` : ""}
      </article>`).join("")}</div>
    </section>
    ${cta}
    <footer>Кейсы присылают сами заявители: наши клиенты (проходят модерацию) и участники открытой базы cases.visarea.travel. Статистика не является гарантией решения консульства.</footer>`);
}
</script>
</body>
</html>
