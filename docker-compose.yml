services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: visabot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d visabot"]
      interval: 10s
      timeout: 5s
      retries: 5

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    mem_limit: 2g

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bot:${POSTGRES_PASSWORD}@db:5432/visabot
      FLARESOLVERR_URL: http://flaresolverr:8191
      PORT: "8080"
      BROWSER_HEADLESS: virtual
    ports:
      - "8080:8080"
    volumes:
      - browser_state:/app/state
      - ./app:/app/app      # live code mount: `git pull && docker compose restart bot` picks up code changes without rebuild

  site:
    build:
      context: ./site
      args:
        SITE_URL: ${SITE_URL:-}        # empty = noindex preview; set to https://<domain> once bought, then rebuild
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}  # ":80" until a domain; set to the domain for auto-HTTPS on 443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  browser_state:
  caddy_data:
  caddy_config:
